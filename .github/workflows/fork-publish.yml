# blue-eric 改进版：构建并发布镜像到 ghcr.io/blue-eric/sgcc_electricity
#
# - 只在 my-custom 分支更新代码、推送 v* 标签、或手动触发时运行
# - 直接使用原作者公开的基础镜像（docker.io/poiigzhao/sgcc_electricity:base），
#   不重建基础镜像，不需要 Docker Hub 账号或任何密钥
# - 原作者的 docker-publish.yml 只在 master 分支触发，与本文件互不影响
name: Fork - 构建并发布镜像

on:
  push:
    branches:
      - my-custom
    tags:
      - 'v*'
    paths:
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/fork-publish.yml'
  workflow_dispatch:

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 只在 fork 中运行，避免被合并到原作者仓库后误触发
    if: github.repository == 'blue-eric/sgcc_electricity'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        run: |
          REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # 推送标签（如 v2.1.1-be.1）时，镜像标签用版本号
            TAG="${{ github.ref_name }}"
            TAG="${TAG#v}"
          else
            TAG="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "镜像: ghcr.io/${REPO_LOWER}:${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=国家电网数据获取（blue-eric 改进版，基于 Poiig/sgcc_electricity）
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up old images (keep latest 10)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10

      - name: Summary
        run: |
          echo "### 镜像已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ steps.vars.outputs.repo_lower }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

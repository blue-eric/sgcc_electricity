name: 问题反馈
description: 运行出错、数据不对等问题（本仓库为 blue-eric 改进版，原版问题请到 Poiig/sgcc_electricity 反馈）
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！本仓库为个人业余维护，尽力而为，不保证响应时间。
        **请务必隐藏账号、密码、手机号、户号、Token、Webhook 地址等敏感信息。**
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 本仓库镜像 ghcr.io/blue-eric/sgcc_electricity
        - 原作者镜像 + 挂载本仓库 scripts 目录
        - 本地运行（python）
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 镜像标签（如 latest、20261024-1530、2.1.1-be.1）或 git 提交号
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: 数据库
      options: [SQLite, MySQL, PostgreSQL]
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 出错前后几十行容器日志（docker logs 容器名 --since 24h），请先隐藏敏感信息
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 与问题有关的 .env 配置项（如 CAPTCHA_SOLVER、DAILY_FETCH_DAYS、USER_NAMES），请隐藏敏感信息
      render: text

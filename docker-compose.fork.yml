# blue-eric/sgcc_electricity（改进版）部署文件
#
# 方式一（推荐）：直接使用本仓库镜像，只需要本文件和 .env
#   docker compose -f docker-compose.fork.yml up -d
#   更新：docker compose -f docker-compose.fork.yml pull && docker compose -f docker-compose.fork.yml up -d
#
# 方式二：使用原作者镜像 + 挂载本仓库 scripts 目录（需要先 git clone 本仓库 my-custom 分支）
#   把 image 换成原作者镜像，并取消下方 ./scripts:/app/scripts 一行的注释
services:
  sgcc_electricity_app:
    # 方式一：本仓库镜像（x86 / ARM 通用）
    image: ghcr.io/blue-eric/sgcc_electricity:latest
    # 方式二：原作者镜像
    # image: ghcr.io/poiig/sgcc_electricity:latest
    # image: ghcr.nju.edu.cn/poiig/sgcc_electricity:latest   # 原作者镜像国内加速
    container_name: sgcc_electricity
    env_file:
      - .env
    environment:
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
      - PYTHON_IN_DOCKER=PYTHON_IN_DOCKER
      - ENV_FILE=/data/.env
      - WEB_DASHBOARD=true
      - WEB_DASHBOARD_PORT=8080
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - ./data:/data              # 数据库、截图、日志等运行数据
      - ./.env:/data/.env         # 配置文件
      # - ./scripts:/app/scripts  # 仅方式二：本仓库代码（覆盖镜像自带的代码）
    init: true

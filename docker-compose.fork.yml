# blue-eric/sgcc_electricity（改进版）部署文件
#
# 使用原作者 Poiig 发布的镜像，把本仓库的 scripts 目录挂载进容器，覆盖镜像自带的代码。
# 用法：在本仓库根目录执行
#   cp example.env .env        # 按注释填写
#   docker compose -f docker-compose.fork.yml up -d
# 更新：git pull 后执行 docker compose -f docker-compose.fork.yml restart
services:
  sgcc_electricity_app:
    # GHCR 镜像（推荐）
    image: ghcr.io/poiig/sgcc_electricity:latest
    # GHCR 南京大学镜像加速（国内推荐）
    # image: ghcr.nju.edu.cn/poiig/sgcc_electricity:latest
    # Docker Hub 镜像加速
    # image: docker.1ms.run/poiigzhao/sgcc_electricity:latest
    container_name: sgcc_electricity
    env_file:
      - .env
    environment:
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
      - PYTHON_IN_DOCKER=PYTHON_IN_DOCKER
      - ENV_FILE=/data/.env
      - WEB_DASHBOARD=true
      - WEB_DASHBOARD_PORT=8080
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - ./data:/data              # 数据库、截图、日志等运行数据
      - ./.env:/data/.env         # 配置文件
      - ./scripts:/app/scripts    # 本仓库代码（覆盖镜像自带的代码）
    init: true
